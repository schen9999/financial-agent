# slm-full-gpu: every agent LLM call on the GPU llama.cpp endpoint on node 2
# (k8s/llamacpp/overlays/k3s-gpu, same GGUF and engine build as the CPU
# endpoint), reached from OKE over the security-list rule; the judge stays
# Sonnet v2. If node 2 serves the -hybrid-ncmoe<n> alias, this run is
# HYBRID, never "GPU". Submit with the traffic proof, never bare:
#   make slm-eval-run ENDPOINT=gpu EVAL_RUN_FILE=argo/eval-run-extended-slm-gpu.yaml
# 40-ticker extended run. Comparison baseline: argo/eval-run-extended.yaml
# (hosted baseline arm) on the SAME pinned OKE image.
# Judge spend: ~$0.06/ticker (grounding judge + RAG-faithfulness judge).
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: grounding-eval-extended-slm-gpu-
  namespace: financial-agent
  labels:
    app.kubernetes.io/part-of: financial-agent
spec:
  workflowTemplateRef:
    name: grounding-eval
  activeDeadlineSeconds: 28800
  arguments:
    parameters:
      - name: arms
        value: slm-full-gpu
      - name: ticker-deadline-seconds
        value: "3600"
      - name: tickers
        value: '["AAPL","MSFT","GOOGL","AMZN","NVDA","META","TSLA","JPM","V","WMT","XOM","UNH","UPST","AFRM","RIVN","LCID","SNAP","PTON","ROKU","COIN","CALM","SFIX","RDFN","BYND","CHGG","BLNK","OMER","EVGO","OCGN","EDIT","SANA","CRBU","VERV","BEAM","NTLA","TSM","NVO","BABA","TM","SAP"]'
