# W4A16 arm of the 40-ticker extended benchmark: identical to
# argo/eval-run-extended-local.yaml except the name prefix, so the run is
# identifiable as the quantized fine-tune. Submit it only while `make vm-vllm
# MODEL_DIR=qwen-ft-w4a16 SERVED_NAME=financial-lora-w4a16` serves; the
# aggregate header names the served model and weights dir.
#
# Local-model arm of the 40-ticker extended benchmark: same tickers as
# argo/eval-run-extended.yaml (source of truth eval/tickers_extended.txt — a
# test keeps all three in sync), arms=local-model (the harness's own arm sets
# USE_LOCAL_MODEL; pointers come from app-config). Outside kustomize like its
# siblings.
#
# A/B comparability: submit this against the SAME image that ran the baseline
# extended pass — do not run `make vm-images` between the two arms, or the
# arms compare different retrieval code.
#
# Submit: make eval-run EVAL_RUN_FILE=argo/eval-run-extended-local-w4a16.yaml
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: grounding-eval-extended-local-w4a16-
  namespace: financial-agent
  labels:
    app.kubernetes.io/part-of: financial-agent
spec:
  workflowTemplateRef:
    name: grounding-eval
  # 40 tickers at parallelism 2 will not fit the template's 1h deadline.
  activeDeadlineSeconds: 10800
  arguments:
    parameters:
      - name: arms
        value: local-model
      - name: tickers
        value: '["AAPL","MSFT","GOOGL","AMZN","NVDA","META","TSLA","JPM","V","WMT","XOM","UNH","UPST","AFRM","RIVN","LCID","SNAP","PTON","ROKU","COIN","CALM","SFIX","RDFN","BYND","CHGG","BLNK","OMER","EVGO","OCGN","EDIT","SANA","CRBU","VERV","BEAM","NTLA","TSM","NVO","BABA","TM","SAP"]'
