# rerank3 arm of the reranking A/B (pre-registered 2026-10-08,
# eval-methodology "Reranking A/B, pre-registered"; decision by
# scripts/rerank_ab_decide.py). Identical to argo/eval-run-extended.yaml
# (the baseline arm) except the arm: 20 cosine candidates reranked by the
# cross-encoder to 3. Submit both in one window:
#   make eval-run EVAL_RUN_FILE=argo/eval-run-extended.yaml
#   make eval-run EVAL_RUN_FILE=argo/eval-run-extended-rerank3.yaml
# Each eval pod downloads and loads the cross-encoder in its first timed
# retrieval, so this run's latency is not the A/B's latency figure
# (scripts/rerank_latency_bench.py is).
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: grounding-eval-extended-rerank3-
  namespace: financial-agent
  labels:
    app.kubernetes.io/part-of: financial-agent
spec:
  workflowTemplateRef:
    name: grounding-eval
  # 40 tickers at parallelism 2 will not fit the template's 1h deadline.
  activeDeadlineSeconds: 10800
  arguments:
    parameters:
      - name: arms
        value: rerank3
      - name: tickers
        value: '["AAPL","MSFT","GOOGL","AMZN","NVDA","META","TSLA","JPM","V","WMT","XOM","UNH","UPST","AFRM","RIVN","LCID","SNAP","PTON","ROKU","COIN","CALM","SFIX","RDFN","BYND","CHGG","BLNK","OMER","EVGO","OCGN","EDIT","SANA","CRBU","VERV","BEAM","NTLA","TSM","NVO","BABA","TM","SAP"]'
