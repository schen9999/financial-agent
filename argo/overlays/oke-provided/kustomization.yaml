# Argo overlay for the PROVIDED OKE cluster (see k8s/overlays/oke-provided).
# The Terraform cluster keeps argo/overlays/oke, untouched.
#
# Deltas from base, and nothing else:
#   - eval-one + aggregate run the GHCR app image, pinned to the same git sha
#     as the app overlay (`make oke-images` rewrites both newTags together)
#   - workflow-level ghcr-pull-secret: Argo hands it to every pod the
#     workflow spawns; the CronWorkflow inherits it via workflowTemplateRef
#   - findings stay on the base emptyDir (multi-node: no hostPath); the
#     per-pod ===EVAL_FINDINGS_TGZ=== stdout dump is the durable channel,
#     recovered with scripts/extract_findings.py
#   - ttlStrategy 7 days (base: 1 day), so pods and their logs — and with
#     them the findings dumps — survive a weekend
#   - nightly CronWorkflow suspended: every fire spends Anthropic credits;
#     evals here are submitted by hand (make eval-run / make slm-eval-run)
#   - optional slm-endpoints Secret on both eval templates, and the
#     per-ticker deadline as a parameter (ticker-deadline-seconds, default
#     the base's 1200s) — verified on Argo v3.7.18 that a templated
#     activeDeadlineSeconds is honoured
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

configurations:
  - kustomizeconfig.yaml

images:
  - name: financial-agent-app
    newName: ghcr.io/schen9999/financial-agent-app
    newTag: 30c832b3495574e2635070e30a51ca95f67d7ae3

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: WorkflowTemplate
      name: grounding-eval
    patch: |-
      - op: add
        path: /spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
      - op: replace
        path: /spec/ttlStrategy/secondsAfterCompletion
        value: 604800
      # SLM endpoint keys + GPU URL for the slm-full-* arms (optional:
      # hosted arms run without the Secret).
      - op: add
        path: /spec/templates/1/container/envFrom/-
        value:
          secretRef:
            name: slm-endpoints
            optional: true
      - op: add
        path: /spec/templates/2/container/envFrom/-
        value:
          secretRef:
            name: slm-endpoints
            optional: true
      # Per-ticker deadline as a parameter (default = base's 1200s): a CPU
      # SLM ticker runs every agent call on llama.cpp and can take far
      # longer. SLM run files raise it; the hosted runs keep 1200s.
      - op: replace
        path: /spec/templates/1/activeDeadlineSeconds
        value: "{{workflow.parameters.ticker-deadline-seconds}}"
      - op: add
        path: /spec/arguments/parameters/-
        value:
          name: ticker-deadline-seconds
          value: "1200"
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: CronWorkflow
      name: grounding-eval-nightly
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
