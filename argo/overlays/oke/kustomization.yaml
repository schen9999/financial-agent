# OKE overlay — Phase 2 target; NOT applied until OCI access lands. CHANGEME
# comes from terraform outputs (ocir_app_repo_url) after the image push.
# JSON6902 with template indices because kustomize strategic merge would
# replace a CRD's whole templates list (and the images: transformer does not
# reach CRD fields without custom configuration).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  # templates: 0=main (dag, no container), 1=eval-one, 2=aggregate
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: WorkflowTemplate
      name: grounding-eval
    patch: |-
      - op: replace
        path: /spec/templates/1/container/image
        value: iad.ocir.io/CHANGEME_NAMESPACE/financial-agent/app:CHANGEME_TAG
      - op: replace
        path: /spec/templates/2/container/image
        value: iad.ocir.io/CHANGEME_NAMESPACE/financial-agent/app:CHANGEME_TAG
      # Workflow-level pull secret: Argo passes it to every pod the workflow
      # spawns; the nightly CronWorkflow inherits it via workflowTemplateRef.
      - op: add
        path: /spec/imagePullSecrets
        value:
          - name: ocir-pull-secret
