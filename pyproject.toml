# Packaging exists for one purpose: the `financial-agent-mcp` console script.
# Runtime dependencies are deliberately NOT declared here — requirements.txt
# stays the single source of truth for the environment (install it first,
# then `pip install -e .` to register the entrypoint).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent"
version = "0.1.0"
description = "Financial research agent — MCP server console entrypoint"
requires-python = ">=3.10"

[project.scripts]
financial-agent-mcp = "mcp_server:main"

[tool.setuptools]
# Flat-layout repo: only what the MCP entrypoint's import chain needs.
py-modules = ["mcp_server", "cache"]
packages = ["agent", "agent.tools"]
