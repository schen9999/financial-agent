name: Deploy

# Runs only after the CI workflow succeeds on main — i.e. tests pass, then deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# OIDC: GitHub gets a short-lived token to assume the AWS deploy role.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "685134814917"
  ECR_REPOSITORY: financial-agent-api
  ECS_CLUSTER: financial-agent-cluster
  ECS_SERVICE: financial-agent-api
  ECS_TASK_FAMILY: financial-agent-api
  CONTAINER_NAME: api

jobs:
  # Skip the (expensive) image build + deploy when only docs/infra/notebooks
  # changed — no point rebuilding the image or churning the task's public IP.
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.filter.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - id: filter
        name: Decide whether a deploy is needed
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files in HEAD commit:"; echo "$CHANGED"
          # Anything NOT matching README.md / docs/ / infra/ / *.ipynb is an
          # app change worth deploying. (Inspects the latest commit — fine for
          # the one-commit-per-push flow used here.)
          CODE=$(echo "$CHANGED" | grep -vE '^(README\.md$|docs/|infra/|.*\.ipynb$)' || true)
          if [ -z "$CODE" ]; then
            echo "Only docs/infra/notebooks changed -> skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "App-relevant changes -> deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/financial-agent-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          echo "IMAGE=$IMAGE:$SHA" >> "$GITHUB_ENV"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > taskdef.json

      - name: Render new task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Deploy to ECS (force new deployment, wait for stability)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
