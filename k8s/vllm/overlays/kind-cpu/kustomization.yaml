# CPU MODE on the local kind cluster — this machine has no GPU. vLLM runs its
# CPU backend inside WSL2; throughput/latency here say NOTHING about GPU
# serving (see benchmarks.md).
#
# Model delivery is exercised locally with a SMALL PUBLIC model
# (Qwen2.5-0.5B-Instruct, no token needed): the fetch-model init container
# downloads it into the emptyDir exactly as oke-gpu will fetch the fine-tuned
# checkpoint from Object Storage. It is a delivery stand-in, not the
# fine-tune — vLLM cannot run on this CPU anyway (no AVX-512), and the
# fine-tuned model is served locally via Ollama (the committed fallback).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - name: vllm-backend
    newName: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo
    newTag: v0.10.2

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vllm
        namespace: financial-agent
      spec:
        template:
          spec:
            initContainers:
              - name: fetch-model
                env:
                  - name: MODEL_BASE_URL
                    value: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/main
                  - name: MODEL_FILES
                    value: "config.json generation_config.json model.safetensors tokenizer.json tokenizer_config.json"
            containers:
              - name: vllm
                imagePullPolicy: Never # kind-loaded
                env:
                  - name: VLLM_CPU_KVCACHE_SPACE # GB reserved for KV cache
                    value: "2"
                resources:
                  requests:
                    cpu: "1"
                    memory: 4Gi
                  limits:
                    cpu: "4"
                    memory: 6Gi
