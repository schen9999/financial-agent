# Single-VM target: single-node k3s. First validated (Phase 1.75) on a
# VM.GPU.A10.2 (2x A10 24 GB, since retired); since 2026-09-23 it runs on
# two VM.GPU.A10.1 nodes (vm-a10-inst-1 demo, vm-a10-inst-2 fallback), where
# the one-GPU pin is the whole node. Purpose: validate the exact serving
# image, tag, and args committed for the OKE A10 — same CUDA build, same
# --gpu-memory-utilization, one GPU. VALIDATED 2026-09-03 on the A10.2:
# rollout green, /v1/models on NodePort 30880 lists financial-lora, serving
# pinned to the one granted A10 (~21 GiB used, second card idle); re-served
# with no manifest changes on both A10.1 nodes 2026-09-23. Evals against it:
# 2026-09-03, 10 tickers, judge v1: 12.31% vs baseline 3.03% unsupported
# (p = 0.054; v1 rates are lower bounds, recall 1/9); 2026-09-05/06, 40
# tickers, judge v2: 8.15% vs 3.06% (p = 0.0023; judge-flagged rates, same
# judge both arms, see docs/numbers-of-record.md) — gate FAILED both
# times, so USE_LOCAL_MODEL ships off.
#
# Deltas vs oke-gpu, all environmental:
#   - Model delivery: hostPath /home/ubuntu/models/qwen-ft (downloaded on the
#     VM with huggingface-cli — see the runbook's single-VM section) replaces
#     the fetch-model init container + emptyDir. No PAR exists yet (no bucket).
#   - CUDA_VISIBLE_DEVICES=0 pins serving to ONE granted A10 — index 0 of
#     the devices the plugin exposes, which may be either physical card
#     (on the VM it granted physical index 1); the request stays
#     nvidia.com/gpu: 1.
#   - No pool selector / GPU toleration: one untainted node.
#   - NodePort 30880, reached only through an ssh -L tunnel — the VM binds
#     nothing publicly.
#
# Model swap: `make vm-vllm MODEL_DIR=... SERVED_NAME=... MAX_LEN=...`
# rewrites the rendered hostPath, --served-model-name, and --max-model-len
# (scripts/vllm_model_swap.py). The values committed here are its defaults;
# change them and the script exits on drift until its defaults follow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - name: vllm-backend
    newName: docker.io/vllm/vllm-openai
    newTag: v0.10.2 # identical to oke-gpu — the point of this target

patches:
  # Drop fetch-model and swap the emptyDir for the hostPath weights dir.
  # JSON6902 because a strategic merge would merge two volume sources into
  # one invalid volume. Also append the same KV-cache arg oke-gpu appends.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vllm
    patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: model
          hostPath:
            path: /home/ubuntu/models/qwen-ft
            type: Directory
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --gpu-memory-utilization=0.90
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vllm
        namespace: financial-agent
      spec:
        template:
          spec:
            containers:
              - name: vllm
                env:
                  - name: CUDA_VISIBLE_DEVICES # A10.2 has two GPUs; serve on one
                    value: "0"
                resources:
                  requests:
                    cpu: "4"
                    memory: 16Gi
                    nvidia.com/gpu: "1"
                  limits:
                    cpu: "8"
                    memory: 32Gi
                    nvidia.com/gpu: "1"
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: vllm
        namespace: financial-agent
      spec:
        type: NodePort
        ports:
          - port: 8000
            nodePort: 30880
