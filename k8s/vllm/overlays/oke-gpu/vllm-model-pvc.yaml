# Holds the merged fine-tuned checkpoint (~3 GB; 50Gi is the OCI block volume
# minimum). Prepopulated in Phase 2 before the vLLM rollout — see the
# kustomization header. StorageClass name must match terraform var
# storage_class_name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: financial-agent
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: financial-agent-bv
  resources:
    requests:
      storage: 50Gi
