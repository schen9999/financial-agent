# MCP server over the streamable-HTTP transport, as its own Service.
# MCP_TRANSPORT selects the transport; MCP_HOST/MCP_PORT set the bind address
# (FastMCP defaults to loopback, unreachable inside a pod; this SDK version
# ignores FASTMCP_* env vars, so mcp_server.py passes them as constructor
# kwargs). The JSON-RPC endpoint is POST /mcp — probes use tcpSocket because
# the endpoint requires MCP framing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/part-of: financial-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp
        app.kubernetes.io/part-of: financial-agent
    spec:
      containers:
        - name: mcp
          image: financial-agent-app:local
          imagePullPolicy: IfNotPresent # kind overlay: Never (kind-loaded); oke overlay: OCIR image
          command: ["python", "mcp_server.py"]
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: app-secrets
            - secretRef:
                name: infra-secrets
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/part-of: financial-agent
spec:
  # ClusterIP in base; exposure is per-overlay (kind: NodePort 30800, oke: stays internal)
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - port: 8000
      targetPort: http
