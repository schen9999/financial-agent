# PostgreSQL for the research_briefs table. Backed by a PVC so briefs survive
# pod restarts — cluster-default StorageClass at 1Gi here; the oke overlay pins
# the Block Volume class at 50Gi (OCI minimum). Credentials come from
# infra-secrets, generated by `make deploy` on first run — never committed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: financial-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: financial-agent
spec:
  replicas: 1
  strategy:
    type: Recreate # single PVC — never run two postgres pods against it
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: financial-agent
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: agent
            - name: POSTGRES_DB
              value: financial_agent
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agent", "-d", "financial_agent"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agent", "-d", "financial_agent"]
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: financial-agent
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
