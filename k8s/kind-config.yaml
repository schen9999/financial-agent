# Single-node kind cluster for the financial-agent stack.
# NodePorts are mapped to host ports so the API (30080), Streamlit UI (30501),
# and MCP server (30800) are reachable from the host at localhost:<port>
# (WSL2 localhost forwarding passes them through to Windows as well).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: financial-agent
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # api
        hostPort: 30080
      - containerPort: 30501 # streamlit
        hostPort: 30501
      - containerPort: 30800 # mcp
        hostPort: 30800
