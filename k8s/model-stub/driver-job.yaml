# One repeat of one benchmark cell: scripts/harness_bench.py as a Job.
# Rendered and created by scripts/harness_bench_cell.sh (JOB_NAME, APP_IMAGE
# and BENCH_ARGS replaced at run time); never applied by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: JOB_NAME
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: harness-bench
    app.kubernetes.io/part-of: financial-agent-bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-bench
        app.kubernetes.io/part-of: financial-agent-bench
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: driver
          image: APP_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/bench/harness_bench.py", BENCH_ARGS]
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: bench
              mountPath: /bench
              readOnly: true
      volumes:
        - name: bench
          configMap:
            name: bench-files
