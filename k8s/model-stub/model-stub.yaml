# Model stub for the harness benchmark (docs/harness-benchmark-plan.md).
# Applied ONLY by `make bench-stub-on` and removed by `make bench-stub-off`;
# not part of any overlay. APP_IMAGE is replaced at apply time with the image
# deploy/worker runs (the pinned app image, already on the nodes), so no new
# image and no new pull. The server is scripts/model_stub.py (stdlib only),
# mounted with the corpus from the bench-files ConfigMap the make target
# creates. ClusterIP only: nothing is exposed.
#
# One replica on purpose: the latency profile and the request counters live
# in the process (POST /stats/profile, GET /stats).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-stub
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: model-stub
    app.kubernetes.io/part-of: financial-agent-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-stub
        app.kubernetes.io/part-of: financial-agent-bench
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: stub
          image: APP_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/bench/model_stub.py"]
          env:
            - name: PROFILE
              value: "L0"
            - name: STUB_CORPUS
              value: /bench/corpus.json
            - name: STUB_MODEL_NAME
              value: model-stub
            - name: PORT
              value: "8080"
            - name: SLM_CPU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slm-endpoints
                  key: SLM_CPU_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: bench
              mountPath: /bench
              readOnly: true
      volumes:
        - name: bench
          configMap:
            name: bench-files
---
apiVersion: v1
kind: Service
metadata:
  name: model-stub
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: model-stub
    app.kubernetes.io/part-of: financial-agent-bench
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-stub
  ports:
    - name: http
      port: 8080
      targetPort: http
