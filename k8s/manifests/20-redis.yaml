# Redis: brief cache (exact key research:{TICKER}, 24h TTL) + Celery broker
# and result backend. Ephemeral by design — the cache is best-effort and
# Celery results are short-lived, so no PVC; a restart just means cold cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: financial-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: financial-agent
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: financial-agent
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: financial-agent
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: redis
