# Helm values for the KEDA install (make keda-install). The chart version
# and its sha256 are pinned in the Makefile (KEDA_CHART_VERSION,
# KEDA_CHART_SHA256); the install refuses a chart whose digest differs.
#
# Chart 2.21.0 = KEDA 2.21.0, which KEDA supports on Kubernetes 1.34–1.36:
# the provided OKE cluster (1.34.1) and the kind baseline (1.36.1) both.
#
# Cluster-level objects it creates (the reason it is a separate, owner-
# cleared step): 6 keda.sh CRDs, the aggregated APIService
# v1beta1.external.metrics.k8s.io, a ValidatingWebhookConfiguration
# (keda-admission: keda.sh objects only, failurePolicy Ignore), 4
# ClusterRoles + 4 ClusterRoleBindings, and RoleBindings in kube-system
# for the metrics adapter. It does not touch v1beta1.metrics.k8s.io
# (metrics-server's).

# Watch only the app namespace: KEDA reconciles nothing anywhere else.
watchNamespace: financial-agent
