# nginx in front of Streamlit for the public UI (k8s/overlays/oke-provided-public-ui).
# Three checks, in order: the client IP must be on the allowlist (allow.conf,
# rendered from the gitignored allowlist.txt), basic auth must pass
# (htpasswd from the streamlit-basic-auth Secret), then the request is proxied
# to Streamlit on the pod's loopback. TLS ends at the OCI load balancer; the
# LB adds X-Forwarded-For, which is trusted only from the VCN's LB, worker
# and pod subnets (the peer is the LB or, after kube-proxy SNAT, a node).
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        set_real_ip_from 10.140.0.64/27;   # pub_lb-tbhcuw (the LB)
        set_real_ip_from 10.140.32.0/20;   # workers-tbhcuw (kube-proxy SNAT)
        set_real_ip_from 10.140.128.0/18;  # pods-tbhcuw
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Pod readiness only: the kubelet probes from the node.
        location = /healthz {
            allow 10.140.0.0/16;
            deny all;
            access_log off;
            return 200 "ok\n";
        }

        location / {
            include /etc/nginx/allow/allow.conf;
            auth_basic "financial-agent";
            auth_basic_user_file /etc/nginx/auth/htpasswd;

            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
